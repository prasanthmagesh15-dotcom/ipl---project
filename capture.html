<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Capture Image · AgriSmart</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body class="app-body">
    <main class="app-shell" data-protected-page>
        <header class="app-header"><h1>Capture Image</h1><a href="dashboard.html">⌂ Home</a></header>
        <section class="app-card" data-leaf-analyzer>
            <h2>Upload a crop leaf</h2>
            <p class="app-muted">Images are analyzed on this device with the saved model; the image is not uploaded.</p>
            <input type="file" accept="image/*" capture="environment" id="leaf-image">
            <img id="leaf-preview" alt="Selected leaf preview" hidden style="width:100%;margin-top:12px;border-radius:14px">
            <button class="app-button" type="button" id="analyze-image" disabled style="margin-top:12px">Analyze Image</button>
            <p id="analysis-status" class="app-muted" role="status" aria-live="polite">Choose or capture a leaf image to begin.</p>
        </section>
        <a class="app-back" href="dashboard.html">← Back to dashboard</a>
    </main>
    <script src="vendor/tfjs-core/tf-core.min.js" defer></script>
    <script src="vendor/tfjs-backend-cpu/tf-backend-cpu.min.js" defer></script>
    <script src="vendor/tfjs-tflite/dist/tf-tflite.min.js" defer></script>
    <script src="leaf-model.js" defer></script>
</body>
</html>
