<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ram's Sensors · AgriSmart</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body class="app-body">
    <main class="app-shell" data-protected-page>
        <header class="app-header">
            <div class="app-profile-heading">
                <img class="app-profile-avatar" src="WhatsApp Image 2026-11-11 at 4.12.25 PM.jpg" alt="Ram, farmer">
                <div><h1>Sensor Monitoring</h1><p class="app-muted">Ram's farm · Sample data</p></div>
            </div>
            <a href="kumar.html">⌂ Home</a>
        </header>
        <section class="app-card sensor-overview"><strong>Farm status: Healthy ✅</strong><p>All sample readings are within the healthy range.</p></section>
        <section class="sensor-grid" aria-label="Sample sensor readings">
            <article class="app-card sensor-card"><span class="sensor-icon">💧</span><span class="app-muted">Soil moisture</span><strong>68%</strong><span class="portal-status">Good</span></article>
            <article class="app-card sensor-card"><span class="sensor-icon">🌡️</span><span class="app-muted">Temperature</span><strong>31°C</strong><span class="portal-status">Normal</span></article>
            <article class="app-card sensor-card"><span class="sensor-icon">💨</span><span class="app-muted">Air humidity</span><strong>72%</strong><span class="portal-status">Good</span></article>
            <article class="app-card sensor-card"><span class="sensor-icon">🧪</span><span class="app-muted">Soil pH</span><strong>6.7</strong><span class="portal-status">Good</span></article>
        </section>
        <p class="app-muted">Static sample readings · Not connected to real sensors</p>
        <nav class="portal-nav"><a href="kumar.html">⌂ Home</a><a href="kumar-sensor.html">📶 Sensors</a><a href="kumar-alerts.html">🔔 Alerts</a></nav>
    </main>
</body>
</html>
