<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wi-Fi Connection · AgriSmart</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body class="app-body">
    <main class="app-shell" data-protected-page>
        <header class="app-header"><h1>Wi-Fi Connection</h1><a href="dashboard.html">⌂ Home</a></header>
        <section class="app-card" style="text-align:center">
            <div style="font-size:70px">📶</div>
            <h2 id="wifi-status">Connected · AgriSmart_2.4G</h2>
            <p class="app-muted">Demo connection status; this page cannot change your device Wi-Fi.</p>
            <button class="app-button" id="wifi-toggle" type="button">Disconnect</button>
        </section>
        <a class="app-back" href="dashboard.html">← Back to dashboard</a>
    </main>
    <script>
        document.getElementById('wifi-toggle').addEventListener('click', (event) => {
            const connected = event.target.textContent === 'Connect';
            document.getElementById('wifi-status').textContent = connected ? 'Connected · AgriSmart_2.4G' : 'Not connected';
            event.target.textContent = connected ? 'Disconnect' : 'Connect';
        });
    </script>
</body>
</html>
