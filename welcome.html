<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriSmart</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <style>
        body { margin: 0; background: var(--welcome-green); font-family: Arial, sans-serif; }
        main { display: flex; max-width: 380px; min-height: 100vh; flex-direction: column; justify-content: center; margin: auto; text-align: center; }
        img { width: 100%; height: 42vh; object-fit: cover; }
        section { margin-top: -22px; padding: 22px; background: var(--floral-white); border-radius: 28px; }
        h1 { margin: 0; }
        p { margin: 12px 0; }
        .dots { color: var(--silver); }
        .dots span:first-child { color: var(--forest-green); }
        .get-started { display: block; margin: 20px 0 0; padding: 14px; color: white; background: var(--forest-green); border-radius: 30px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <main>
        <img src="WhatsApp Image 2026-11-11 at 4.12.25 PM.jpg" alt="Farmer">
        <section>
            <h1>Welcome to AgriSmart!</h1>
            <p>Your Smart Farming Companion</p>
            <div class="dots"><span>●</span> ● ●</div>
            <a class="get-started" href="login.html">Get Started →</a>
        </section>
    </main>
</body>

</html>
