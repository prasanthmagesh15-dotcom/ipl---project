<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <title>Sensor Monitoring · AgriSmart</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body class="app-body sensor-body">
    <main class="app-shell sensor-page" data-protected-page>
        <header class="app-header sensor-header">
            <a href="ravi.html" aria-label="Back to home">←</a>
            <h1>Sensor Monitoring</h1>
        </header>
        <section class="sensor-readings">
            <h2>Today's Sensor Readings</h2>
            <div class="sensor-grid" aria-label="Today's sensor readings">
                <article class="app-card sensor-card">
                    <span class="sensor-card-heading"><span class="sensor-icon">💧</span><span class="app-muted">Soil Moisture</span></span>
                    <strong>18<small>%</small></strong><span class="portal-status alert">Low</span>
                </article>
                <article class="app-card sensor-card">
                    <span class="sensor-card-heading"><span class="sensor-icon">🌡️</span><span class="app-muted">Temperature</span></span>
                    <strong>36<small>°C</small></strong><span class="portal-status alert">High</span>
                </article>
                <article class="app-card sensor-card">
                    <span class="sensor-card-heading"><span class="sensor-icon">💨</span><span class="app-muted">Humidity</span></span>
                    <strong>34<small>%</small></strong><span class="portal-status alert">Low</span>
                </article>
                <article class="app-card sensor-card">
                    <span class="sensor-card-heading"><span class="sensor-icon">🧪</span><span class="app-muted">pH</span></span>
                    <strong>5.2</strong><span class="portal-status alert">Low</span>
                </article>
            </div>
        </section>
        <nav class="portal-nav"><a href="ravi.html">⌂ Home</a><a class="active" href="ravi-sensor.html" aria-current="page">📶 Sensors</a><a href="ravi-alerts.html">🔔 Alerts (4)</a></nav>
    </main>
</body>
</html>
