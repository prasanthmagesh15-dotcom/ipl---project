<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <title>Weather Forecast · AgriSmart</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body class="app-body">
    <main class="app-shell" data-protected-page>
        <header class="app-header"><h1>Weather Forecast</h1><a href="dashboard.html">⌂ Home</a></header>
        <section class="app-card">
            <p><span data-demo="city">Chennai</span> · Forecast</p>
            <h2><span data-demo="weatherIcon">☀️</span> <span data-demo="temperature">32°C</span></h2>
            <p data-demo="weatherCondition">Mostly sunny</p>
        </section>
        <section class="app-grid">
            <article class="app-card"><strong>Mon</strong><p>☀️ 34°</p></article>
            <article class="app-card"><strong>Tue</strong><p>🌤️ 33°</p></article>
            <article class="app-card"><strong>Wed</strong><p>🌦️ 31°</p></article>
            <article class="app-card"><strong>Thu</strong><p>☀️ 32°</p></article>
            <article class="app-card"><strong>Fri</strong><p>🌤️ 33°</p></article>
            <article class="app-card"><strong>Sat</strong><p>☀️ 34°</p></article>
        </section>
        <a class="app-back" href="dashboard.html">← Back to dashboard</a>
    </main>
</body>
</html>
