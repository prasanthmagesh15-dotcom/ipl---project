<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crop Details · AgriSmart</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body class="app-body">
    <main class="app-shell" data-protected-page>
        <header class="app-header"><h1>Crop Details</h1><a href="dashboard.html">⌂ Home</a></header>
        <section class="app-card">
            <h2>🌾 <span data-demo="cropName">Paddy Field</span></h2>
            <span class="app-chip" data-demo="cropStatus">Healthy</span>
            <p>Growth stage: <strong data-demo="cropStage">Tillering · 65%</strong></p>
            <p>Field size: <strong data-demo="fieldArea">2.5 acres</strong></p>
        </section>
        <section class="app-card">
            <h2>Care tips</h2>
            <p>✓ Keep soil moist, but avoid waterlogging.</p>
            <p>✓ Check leaves regularly for pests or disease.</p>
            <p>✓ Follow a locally recommended nutrient plan.</p>
        </section>
        <a class="app-back" href="dashboard.html">← Back to dashboard</a>
    </main>
</body>
</html>
