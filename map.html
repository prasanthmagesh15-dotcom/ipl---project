<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <title>Farm Map · AgriSmart</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body class="app-body">
    <main class="app-shell" data-protected-page>
        <header class="app-header"><h1>Farm Map</h1><a href="dashboard.html">⌂ Home</a></header>
        <div class="map-plot" role="img" aria-label="Illustrative map of the farm"><span class="map-pin">📍</span></div>
        <section class="app-card">
            <h2>🌾 <span data-demo="cropName">Paddy Field</span></h2>
            <p>Owner: <strong data-demo="farmerName">Farmer</strong></p>
            <p>Area: <strong data-demo="fieldArea">2.5 acres</strong></p>
            <span class="app-chip" data-demo="cropStatus">Healthy</span>
        </section>
        <p class="app-muted">Map illustration only; it does not show a real farm location.</p>
        <a class="app-back" href="dashboard.html">← Back to dashboard</a>
    </main>
</body>
</html>
