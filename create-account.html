<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account · AgriSmart</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: honeydew; font: 15px Arial, sans-serif; }
        main { width: min(100%, 390px); padding: 28px 22px; background: white; text-align: center; }
        h1 { color: darkgreen; }
        input, button { width: 100%; margin: 7px 0; padding: 13px; border: 1px solid gainsboro; border-radius: 20px; font: inherit; }
        button { color: white; background: forestgreen; font-weight: bold; cursor: pointer; }
        #message { min-height: 22px; color: darkgreen; font-weight: bold; }
        a { color: darkgreen; }
    </style>
</head>
<body>
    <main>
        <h1>Create Account</h1>
        <form id="create-form">
            <input name="name" placeholder="Enter your name" aria-label="Name" required>
            <button type="submit">Create Account</button>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
        <a href="login.html">Back to Login</a>
    </main>
    <script>
        document.getElementById('create-form').addEventListener('submit', (event) => {
            event.preventDefault();
            document.getElementById('message').textContent = 'Account created successfully!';
        });
    </script>
</body>
</html>
