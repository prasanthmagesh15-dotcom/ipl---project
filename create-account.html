<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <title>Create Account · AgriSmart</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--honeydew); font: 15px Arial, sans-serif; }
        main { width: min(100%, 390px); padding: 28px 22px; background: white; text-align: center; }
        h1 { color: var(--dark-green); }
        input, button { width: 100%; margin: 7px 0; padding: 13px; border: 1px solid var(--gainsboro); border-radius: 20px; font: inherit; }
        button { color: white; background: var(--forest-green); font-weight: bold; cursor: pointer; }
        #message { min-height: 22px; color: var(--dark-green); font-weight: bold; }
        a { color: var(--dark-green); }
    </style>
</head>
<body>

    <main>
        <h1>Create Account</h1>
        <form id="create-form">
            <input name="name" placeholder="Enter your name" aria-label="Name" required>
            <input name="city" placeholder="Enter your city" aria-label="City" autocomplete="address-level2" required>
            <input type="tel" name="number" placeholder="Enter your number" aria-label="Phone number" autocomplete="tel" required>
            <input type="password" name="password" placeholder="Create password" aria-label="Password" autocomplete="new-password" required>
            <button type="submit">Create Account</button>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
        <a href="login.html">Back to Login</a>
    </main>
    <script>
        document.getElementById('create-form').addEventListener('submit', (event) => {
            event.preventDefault();
            document.getElementById('message').textContent = 'Account created successfully!';
        });
    </script>
</body>
</html>
