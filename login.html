<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AgriSmart Login</title>
    <script src="app.js" defer></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 14px Arial, sans-serif; background: honeydew; }
        main { width: min(100%, 390px); min-height: 100vh; padding: 28px 22px 18px; text-align: center; background: white; display: flex; flex-direction: column; }
        .logo { color: forestgreen; font-size: 42px; line-height: 1; }
        h1 { margin: 6px 0; color: darkgreen; font-size: 22px; }
        p { margin: 0 0 16px; }
        input, button, .create-account { width: 100%; padding: 13px; margin: 5px 0; border: 1px solid gainsboro; border-radius: 22px; background: white; }
        input { text-align: left; }
        button, .create-account { font-weight: bold; cursor: pointer; }
        .login { color: white; background: forestgreen; }
        .login-error { min-height: 18px; margin: 4px 0; color: firebrick; }
        .create-account { display: block; color: darkgreen; text-decoration: none; }
        footer { margin: auto -22px -18px; padding: 22px 0 8px; color: forestgreen; background: linear-gradient(white, lightgreen); font-size: 25px; }
    </style>
</head>
<body>
    <main>
        <div class="logo">🌿</div>
        <h1>AgriSmart</h1>
        <p>Login to continue</p>
        <form data-login-form>
            <input type="text" name="loginId" placeholder="Farmer name" aria-label="Farmer name" autocomplete="username" required>
            <input type="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
            <p class="login-error" data-login-error role="alert"></p>
            <button class="login" type="submit">Login</button>
        </form>
        <a class="create-account" href="create-account.html">Create Account</a>
        <footer>🌱　🌳　🌿　🌳　🌱</footer>
    </main>
</body>
</html>
